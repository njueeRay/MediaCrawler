name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Ruff lint
        run: uv run ruff check api/ config/ store/ model/ --select E,W,F,I --ignore E501,E402

      - name: Mypy type check
        run: uv run mypy api/ --ignore-missing-imports --no-strict-optional --exclude "api/webui"
        continue-on-error: true  # warn-only until full coverage reached

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webui-src/package-lock.json

      - name: Install dependencies
        working-directory: webui-src
        run: npm ci

      - name: Build
        working-directory: webui-src
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -x --tb=short -q
        env:
          SAVE_DATA_OPTION: sqlite
          WECHAT_AUTH_KEY: ""
          FEISHU_APP_ID: ""
          FEISHU_APP_SECRET: ""
