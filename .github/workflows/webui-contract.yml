name: WebUI Contract Gate

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'api/**'
      - 'webui-src/**'
      - 'test/**'
      - '.github/workflows/webui-contract.yml'
  push:
    branches: [main, dev]
    paths:
      - 'api/**'
      - 'webui-src/**'
      - 'test/**'
      - '.github/workflows/webui-contract.yml'

jobs:
  response-contract:
    name: API response contract scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run router response contract scan
        run: python test/test_api_response_contract_scan.py

  webui-build:
    name: WebUI build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui-src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui-src/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build WebUI
        run: npm run build
